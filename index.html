
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Smart Campus Management System</p>
</header>

<div class="container">

    <!-- Student Registration -->
    <section class="card">
        <h2>Student Registration</h2>

        <form id="studentForm">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="name" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="roll" placeholder="Enter roll number" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech CSE</option>
                    <option>B.Tech ECE</option>
                    <option>B.Tech EEE</option>
                    <option>BCA</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Total Classes</label>
                <input type="number" id="totalClasses" min="1" placeholder="Example: 100" required>
            </div>

            <div class="form-group">
                <label>Classes Attended</label>
                <input type="number" id="attendedClasses" min="0" placeholder="Example: 85" required>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" id="marks" min="0" max="100" placeholder="Enter marks" required>
            </div>

            <button type="submit">Add Student</button>
        </form>
    </section>


    <!-- Search -->
    <section class="search-box">
        <input type="text" id="search" placeholder="Search by name or roll number...">
    </section>


    <!-- Student Records -->
    <section class="card">
        <h2>Student Records</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Attendance</th>
                        <th>Marks</th>
                        <th>Result</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>
            </table>
        </div>
    </section>

</div>

<script src="script.js"></script>

</body>
</html>
