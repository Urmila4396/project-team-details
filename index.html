<!DOCTYPE html>
<html>
<head>
  <title>Student Management System</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Student Management System</h1>
  <h3>Smart Campus Management System</h3>

  <h2>Student Registration</h2>
  <label>Student Name:</label>
  <input type="text" id="name"><br><br>
  <label>Roll Number:</label>
  <input type="text" id="roll"><br><br>
  <label>Email:</label>
  <input type="text" id="email"><br><br>
  <label>Course:</label>
  <input type="text" id="course"><br><br>
  <label>Total Classes:</label>
  <input type="number" id="total"><br><br>
  <label>Classes Attended:</label>
  <input type="number" id="attended"><br><br>
  <label>Marks:</label>
  <input type="number" id="marks"><br><br>
  <button onclick="addStudent()">Add Student</button>

  <h2>Student Records</h2>
  <table id="studentTable">
    <tr>
      <th>Name</th>
      <th>Roll No</th>
      <th>Course</th>
      <th>Email</th>
      <th>Attendance</th>
      <th>Marks</th>
      <th>Result</th>
    </tr>
  </table>

  <script>
    function addStudent() {
      const name = document.getElementById("name").value;
      const roll = document.getElementById("roll").value;
      const email = document.getElementById("email").value;
      const course = document.getElementById("course").value;
      const total = parseInt(document.getElementById("total").value);
      const attended = parseInt(document.getElementById("attended").value);
      const marks = parseInt(document.getElementById("marks").value);

      const attendance = ((attended / total) * 100).toFixed(2) + "%";
      const result = marks >= 40 ? "Pass" : "Fail";

      const table = document.getElementById("studentTable");
      const row = table.insertRow();
      row.insertCell(0).innerText = name;
      row.insertCell(1).innerText = roll;
      row.insertCell(2).innerText = course;
      row.insertCell(3).innerText = email;
      row.insertCell(4).innerText = attendance;
      row.insertCell(5).innerText = marks;
      row.insertCell(6).innerText = result;
    }
  </script>
</body>
</html>
